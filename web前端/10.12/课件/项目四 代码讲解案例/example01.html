<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>边框样式</title>
<style type="text/css">
h2{
	border-top-style: double;
	/* double:双实线 */
	border-right-style: double;
	border-bottom-style:double;
	border-left-style:double;

	/* border-style:double; */

	border-style: double solid dashed dotted;
	/* 上 右 下 左 */
	/* 双实线 单实线 虚线 点线 */
}

.one{
	border-color:pink;
	/* 没有设置边框样式，则不会显示颜色 */
}

</style>
</head>
<body>
	<h2>四条边框为双实线</h2>
	<p class="one">上边框和下边框为点线，左边框和右边框为单实线</p>
	<p class="two">上边框为单实线，左边框和右边框为点线，下边框为虚线</p>
</body>
</html>
