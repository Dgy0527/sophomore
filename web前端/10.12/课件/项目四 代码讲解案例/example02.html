<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>边框宽度</title>
<style type="text/css">
p{
	border-style:solid;
	border-top-width: 3px;
	border-left-width:1px;
	border-right-width:1px;
	border-bottom-width:1px;
	
	/* border-width:3px 1px; */

	border-color: red green blue pink;
}

</style>
</head>
<body>
	<p>上边框为3px，下边框、左边框、右边框均为1px。边框样式为单实线。</p>
</body>
</html>
