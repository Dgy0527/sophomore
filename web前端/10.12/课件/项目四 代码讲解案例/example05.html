<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>外边距</title>
<style type="text/css">
*{
	padding:0;         /*清除内边距*/
	margin:0;          /*清除外边距*/
}

img{
	border:5px solid green;
	float:left;
	margin-right: 20px;
}

p{
	width:500px;
	background-color:pink;
	margin:0 auto;
	/* 0:垂直 auto:水平 */
}

</style>
</head>
<body>
	<img src="longmao.png" alt="龙猫和小月姐妹" />
	<p>龙猫剧情简介：小月的母亲生病住院了，父亲带着她与妹妹到乡下居住。她们在乡下遇到了很多小精灵，更与一只大大胖胖的龙猫成为了朋友。龙猫和小精灵们利用它们的神奇力量，为小月和妹妹带来了很多神奇的景观…</p>
</body>
</html>
