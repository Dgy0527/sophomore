<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>设置背景图像</title>
<style type="text/css">

h2{
	font-family:"微软雅黑"; 
	color:#fff;
}

p{
	width:500px;
	height:400px;
	background-color:pink;
	background-image:url("./pic4.png");
	background-repeat:no-repeat;
	/* repeat-x:水平方向平铺开 */

	background-position:left top;
	background-position:35px 50px;
	/* background-position:先水平再垂直 */
}
</style>
</head>
<body>
	<h2>UI设计前景超乎想象</h2>
	<p>“互联网+”与O2O模式的大趋势，使平面设计、网页设计、UI设计、Web前端的前景广阔超乎想象。</p>
</body>
</html>
