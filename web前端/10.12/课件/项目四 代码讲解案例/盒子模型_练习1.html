<!doctype html>

<head>
<meta charset="utf-8">
<title>练习1_综合设置边框</title>
<style type="text/css">

/*
	一、为h2标题设置如下样式：
	1. 文本居中对齐；
	2. 下边框为蓝色、5px宽的双实线
*/








/*
	二、为p段落设置如下样式：

	3. 下边框为#CCC色、3px宽的点线
	4. 左边框为绿色、10px宽的实线
*/











/*
	三、为img图像设置如下样式：
	1. 边框为#CCC色、15px宽的实线
*/





</style>
</head>
<body>
<h2>设置边框属性</h2>
