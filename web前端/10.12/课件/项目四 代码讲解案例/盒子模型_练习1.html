<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>练习1_综合设置边框</title>
<style type="text/css">

/*
	一、为h2标题设置如下样式：
	1. 文本居中对齐；
	2. 下边框为蓝色、5px宽的双实线
*/
h2{
	text-align:center;
	border-bottom-color:blue;
	border-bottom-width:5px;
	border-bottom-style:double;

	/* border-bottom:blu 5px double; */
}

/*
	二、为p段落设置如下样式：
	1. 上边框为#F00色、3px宽的虚线
	2. 右边框为#900色、10px宽的双实线
	3. 下边框为#CCC色、3px宽的点线
	4. 左边框为绿色、10px宽的实线
*/
p{
	border-top-color:#F00;
	border-top-width:3px;
	border-top-style:dashed;
	/* border-top:#F00 3px dashed; */

	border-right-color:#900 10px double;
	border-right-width:10px;
	border-right-sytle:double;
	/* border-right:#900 10px double; */

	border-bottom-color:#ccc;
	border-bottom-width:3px;
	border-bottom-style:dotted;
	/* border-bottom:#ccc 3px dotted; */

	border-left-color:green;
	border-left-width:10px;
	border-left-style:solid;
	/* border-left: green 10px solid; */
}
/*
	三、为img图像设置如下样式：
	1. 边框为#CCC色、15px宽的实线
*/
img{
	border:#ccc 15px solid;
}

</style>
</head>
<body>
<h2>设置边框属性</h2>
<p>该段落使用单侧边框的综合属性，分别给上、右、下、左四个边设置不同的样式。</p>
<img src="tu.png" alt="图片" />
</body>
</html>
