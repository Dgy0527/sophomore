<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>块元素、行内元素_练习2</title>
<style type="text/css">

p{font-size: 20px;}
.red{background-color: red;}
.green{background-color: green;}
.blue{background-color: blue;}
.black{background-color: black;}

/*
    1.修改代码，使得"div部分"后显示4个100px*100px的正方形盒子，且4个盒子同行显示
	2.修改代码，使得"span部分"后显示4个100px*100px的正方形盒子，且4个盒子同行显示
*/



</style>
</head>
<body>
    <p>div部分</p>
    <div class="red"></div><div class="green"></div>
    <div class="blue"></div><div class="black"></div>
    
    <p>span部分</p>
    <span class="red"></span>
    <span class="green"></span>
    <span class="blue"></span>
    <span class="black"></span>
</body>
</html>
