<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>练习2_内边距属性</title>
<style type="text/css">


/*
	一、为图像和段落设置如下样式：
	1. 边框为#CCC色、5px宽的实线
*/
img{
	border-color:#CCC;
	border-width:5px;
	border-style:solid;
	
}






/*
	二、为图像设置如下样式：
	1. 上、左、右三个方向的内边距为80px
*/
img{
	padding:80px 80px 80px 80px;
}







/*
	三、设置p段落的内边距为父元素宽度的5%
*/
p{
	padding:5%;
}





</style>
</head>
<body>
<img class="border" src="padding_in.png" alt="内边距" />
<p class="border">段落内边距为父元素宽度的5%。</p>
</body>
</html>
