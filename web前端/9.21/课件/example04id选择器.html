<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>id选择器</title>
<style type="text/css">
    #font2{
        font-size:24px;
    }

    /* *：通配符 */
    *{
        color:red;
    }
</style>
</head>
<body>
<p id="bold">段落1：id="bold"，设置粗体文字。</p>
<p id="font2">段落2：id="font24"，设置字号为24px。</p>
<p id="font4">段落3：id="font24"，设置字号为24px。</p>
<p id="bold font24">段落4：id="bold font24"，同时设置粗体和字号24px。</p>
</body>
</html>
