<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>类选择器</title>
<style type="text/css">
    p{
        color:red;
    }

    /* .zuozhe的意思是找到<class>标签内值为zuozhe的 */
    .zuozhe{
        color:red;
    }
    .green{
        color:green;
    }
    /* italic:字体变斜体 */
    .font1{
        font-style:italic;
    }
 
    /* css的层叠性 */
    p{
        color:red;
        font-size:32px;
    }
    p{
        font:italic 64px "黑体";
        color: green;
        text-align: center;
    }
</style>
</head>
<body>
<h2 class="green">静夜思</h2>
<p class="zuozhe">唐：李白</p>
<p class="green font1">床前明月光，</p>
<p>疑是地上霜。</p>
<p>举头望明月，</p>
<p>低头思故乡。</p>
</body>
</html>
