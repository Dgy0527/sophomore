<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>后代选择器</title>
<style type="text/css">
    strong{
        color:blue;
    }

    p strong{
        color:red;
    }
</style>
</head>
<body>
<p>段落文本<strong>嵌套在段落中，使用strong标签定义的文本（红色）。</strong></p>
<strong>嵌套之外由strong标签定义的文本（蓝色）。</strong>

</body>
</html>
