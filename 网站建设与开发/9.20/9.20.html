<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        p{
            color:red;
            font-size:36px;
        }
        /*注释*/
        h1{
            color:"red"; /* color是单属性 */
            font-size:36px;
        }
        
    </style>

</head>

<body>
    <!-- 不使用CSS,实现 加粗、斜体、颜色的效果：需要三重标签嵌套 -->
    <p>
        <strong>
            <i>
                <font color="red">
                    这是一段话
                </font>
            </i>
        </strong>
    </p>

    <h1>ddd</h1>

    <!-- 使用CSS,font-weight/color/font-size -->

    <!-- 行内式 -->
    <p style="color:red;font-size:36px;"> 
        这是一段话
    </p>

    <!-- 内嵌式 -->
    <p>
        <strong>
            <i>
                <font color="red">
                    这是一段话
                </font>
            </i>
        </strong>
    </p>

    <!-- 外链式 -->
    

</body>
</html>
