<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>设置背景图像的位置</title>
<style type="text/css">
/*1. 使用预定义的关键字: left/right/center, top/center/bottom   */
/*2. 使用不同单位的数值: x y  */
/*3.    使用百分比  */
/*4. 设置背景图像固定*/
/*5. background属性综合设置*/

body{
	background-image:url(pic5.png);    /*设置网页的背景图像*/
	background-repeat:no-repeat;                /*设置背景图像不平铺*/
	background-color: #ccc;    

	background-position:center center;  /* 设置图像水平方向和垂直方向都居中*/
	background-position:center top;
	background-position:center bottom;
	background-position:20px 20px;
	background-position:50% 50%;

	background-attachment:scroll;
	background-attachment:fixed;

	background:#ccc url(pic5.png) no-repeat 50% 50% fixed;  /*background的综合设置,可以少但顺序不能变*/


}

</style>
</head>
<body>
<h2> UI设计培养如此全能的人才</h2>
<p>UI设计培训课程非常系统、全面，从软件操作、理论知识、实战练习、就业指导等方面设置都很科学完善，只要跟着老师的节奏来，哪怕零基础学员也不会有任何影响。针对学员的基础情况，我们分为基础班和就业班两种。</p>
</body>
</html>
