<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>内边距属性</title>
<style type="text/css">
    .border{ border:5px solid #ccc;}     /*为图像和段落设置边框*/

</style>
</head>
<body>
<img class="border" src="padding_in.png" alt="为图片设置内边距：下内边距为0，其余内边距均为80px" />
<p class="border">段落内边距为父元素宽度的5%</p>
</body>
</html>
