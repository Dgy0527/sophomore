<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>元素的浮动属性</title>
<style type="text/css"> 
/*
1. 使用inline-block使其水平排列
2. 使用float使其左右分布排列
3. 添加第三个浮动块
*/
.one{
	width:100px;
	height:100px;
	background:pink;

	float:left;

}
.two{
	width:150px;
	height:150px;
	background:red;

	float:left;
}

.three{
	width:200px;
	height:200px;
	background:blue;
	float:left;
}


div{
	display:inline-block;
}


</style>
</head>
<body>
    <div class="one"></div>
    <div class="two"></div>
	
	<div class="three"></div>
</body>
</html>
