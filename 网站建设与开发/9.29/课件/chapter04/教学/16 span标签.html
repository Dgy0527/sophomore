<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>span标签</title>
<style type="text/css"> 
	/*通过外边距设置文字间隔*/
    .one{color:red;}
    .two{color:pink;}
    .three{color:blue;}
    .four{color:purple;}
    .five{color:green;} 
    span{
        margin-right:20px;
    }

</style>
</head>
<body>
<h2>课程推荐</h2>
<div>
	<span class="one">UI设计</span>
    <span class="two">Java</span>
    <span class="three">人工智能</span>
    <span class="four">产品经理</span>
    <span class="five">前端移动与开发</span>
</div>
<div>
</div>
</body>
</html>
