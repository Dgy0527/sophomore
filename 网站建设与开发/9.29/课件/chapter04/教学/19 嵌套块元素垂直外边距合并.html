<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>嵌套块元素上外边距的合并</title>
<!--
1. 小盒子设置20px上边距
2. 大盒子设置20px上边距，小盒子10px
3. 大盒子设置20px上边距，小盒子40px
 -->
<style type="text/css">
*{margin:0; padding:0;}   /*使用通配符清除所有HTML标签的默认边距*/
div.father{
	width:400px;
	height:400px;
	background:#FC0;	
	border-top:1px solid red;       /*定义父div的上边框*/ 

	}
div.son{
	width:200px;
	height:200px;
	background:#63F;	
	}
</style>
</head>
<body>
<div class="father">
     <div class="son"></div>
</div>
</body>
</html>
