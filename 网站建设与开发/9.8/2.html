<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>文本样式标签font</title>>
</head>
<body>
    <h2 align="center">
        使用font标签设置文本样式
    </h2>
    <p size="2" color="blue">我是默认样式的文本</p>
    <p><font size="2" color="blue">我是2号蓝色文本</font></p>
    <p><font size="5" color="red">我是5号红色文本</font></p>
    <p><font size=/ color="green" face="宋体">我是/号绿色文本,我的字体是微软雅黑。</font></p>
</body>
</html>
