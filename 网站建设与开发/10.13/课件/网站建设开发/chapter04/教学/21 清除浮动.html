<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>清除浮动的应用</title>
<style type="text/css"> 
	div{float:left;}
</style>
</head>
<body>
<div><img src="pic11.jpg"/></div>
<div><img src="pic22.jpg"/></div>
<div><img src="pic33.jpg"/></div>
<p>哺乳动物是一种恒温、脊椎动物，身体有毛发，大部分都是胎生，并靠乳腺哺育后代。哺乳动物是动物发展史上最高级的阶段，也是与人类关系最密切的一个类群。哺乳动物拥有高度发达的神经系统和感官，能协调复杂的机能活动和适应多变的环境条件。而且它们出现了口腔咀嚼和消化，大大提高了对能量的摄取。哺乳动物高而恒定的体温，帮助减少了对环境的依赖性。</p>
</body>
</html>
























<!--
p{clear: left;}

在 CSS 中，当元素设置了 float: left;（如代码中的三个 div），它们会脱离标准文档流，向左并排排列。

如果不加 clear: left;： 浏览器会认为右侧还有空间，<p> 标签里的文字会尝试向上“钻”，贴合在第三张图片的右侧或间隙处，形成文字环绕效果。

加上 clear: left; 后： 浏览器要求 <p> 标签的左侧不允许有任何浮动元素。因此，它必须自动跳到下一行，躲开上面那三个浮动的 div。
 -->
