<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>盒子的宽度与高度</title>
<style type="text/css">
/*
1. 添加border: 10px、实线、红色
2. 添加padding: 20px
3. 添加margin: 20px
*/
.box{
	width:200px;                   /*设置段落的宽度*/
	height:50px;                   /*设置段落的高度*/
	background:#CCC;               /*设置段落的背景颜色*/
}
</style>
</head>
<body>
<p class="box">盒子模型的宽度与高度</p>
</body>
</html>
