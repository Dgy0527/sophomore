<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>相邻块元素垂直外边距的合并</title>
<style type="text/css">
/* 1. 先设置垂直边距
   2. 再设置水平边距
*/ 
.one{
	width:150px;
	height:150px;
	background:#FC0;	
	}
.two{

	width:150px;
	height:150px;
	background:#63F;	

	}
</style>
</head>
<body>
<div class="one">1</div>
<div class="two">2</div>
</body>
</html>
