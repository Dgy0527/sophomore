<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>边框样式</title>
<style type="text/css">
	h2 {
		border: double;
	}
	.one {
		/*border-style: dotted solid;*/
		border-style: dotted solid dotted;
	}
	.two {
		border-style: solid dotted dashed;
	}
	
	/*
	1个： 所有
	2个： 上下，左右
	3个： 上， 左右， 下
	4个： 上，右，下，左
	*/
</style>
</head>
<body>
<h2>四条边框为双实线</h2>
<p class="one">上边框和下边框为点线，左边框和右边框为单实线</p>
<p class="two">上边框为单实线，左边框和右边框为点线，下边框为虚线</p>
</body>
</html>
