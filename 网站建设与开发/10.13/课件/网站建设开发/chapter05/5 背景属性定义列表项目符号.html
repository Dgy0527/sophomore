<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>背景属性定义列表项目符号</title>
<style type="text/css">
/* 1. 通过 list-style:none清除列表默认样式
   2. 设置背景为图片，调整图片位置
   3.  增加高度属性
   4. 调整文字位置   
*/

ul{
    list-style:none;
    background:url("./images/book.png") left center no-repeat;
    padding-left:25px;
}

</style>
</head>
<body>
<h2>黑马程序员原创教材</h2>
<ul>
	<li>Photoshop CS6图像设计案例教程</li>
    <li>网页设计与制作（HTML+CSS）</li>
    <li>PHP网站开发实例教程</li>
    <li>C语言开发入门教程</li>
</ul>
</body>
</html>
