<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>链接伪类</title>
<style type="text/css">
	/*1.鼠标悬停时出现下划线; 未访问和访问后，清除超链接默认的下划线
	2. 鼠标点击不动, 文字为蓝色*/

	a:link,a:visited{
		text-decoration:none;
		color:black;
	}

	a:hover{
		text-decoration:underline;
		color:blue;
	}

	a:active{
		color:red;
	}

</style>
</head>
<body>
    <a href="https://www.baidu.com">百度</a>
    <a href="https://www.jd.com">京东</a>
    <a href="https://www.12306.cn">12306</a>
    <a href="https://www.szpu.edu.cn/">深职大</a>
</body>
</html>
