<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>创建超链接</title>
</head>
<!--
1. 创建访问百度的超链接（文字）
2. 修改弹窗方式target为_self, _blank
3. 创建访问百度的超链接（图片）
 -->

<body>
    <a href="#" target="_blank"><img src="./images/click.png">百度</a>
    <!-- _self :本地页打开 _blank :新标签页打开 -->

</body>
</html>
